services:
  # ─── Prometheus (metrics collection) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: depi-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring
      - app

  # ─── Grafana (dashboards & visualization) ───────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: depi-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─── Node Exporter (host CPU / RAM / disk) ──────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: depi-node-exporter
    restart: unless-stopped
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring

  # ─── cAdvisor (Docker container metrics) ────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: depi-cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring
      - app

  # ─── MySQL Exporter (database metrics) ────────────────────────────────────────
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: depi-mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    volumes:
      - ./prometheus/.my.cnf:/.my.cnf:ro
    command:
      - "--config.my-cnf=/.my.cnf"
    networks:
      - monitoring
      - app

  # ─── Redis Exporter (cache metrics) ─────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: depi-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks:
      - monitoring
      - app

  # ─── Blackbox Exporter (HTTP uptime for storefront) ───────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: depi-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
      - app

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
  app:
    external: true
    name: ${APP_DOCKER_NETWORK:-ecommercelaravel_depi-network}
