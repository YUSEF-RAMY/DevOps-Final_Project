---
- name: Ensure monitoring directory exists on server
  file:
    path: "{{ app_dir }}/monitoring"
    state: directory
    mode: "0755"

- name: Copy monitoring stack to server
  copy:
    src: "{{ playbook_dir }}/../monitoring/"
    dest: "{{ app_dir }}/monitoring/"
    mode: preserve

- name: Detect application Docker network name
  shell: docker network ls --format '{{"{{"}}.Name{{"}}"}}' | grep depi-network | head -1
  register: depi_network
  changed_when: false
  failed_when: false

- name: Write monitoring .env with detected network
  copy:
    dest: "{{ app_dir }}/monitoring/.env"
    content: |
      APP_DOCKER_NETWORK={{ depi_network.stdout | default('devops_final_project_depi-network', true) }}
    mode: "0600"

- name: Start Prometheus + Grafana monitoring stack
  shell: docker compose --env-file .env up -d
  args:
    chdir: "{{ app_dir }}/monitoring"
  register: monitoring_start
  changed_when: "'Started' in monitoring_start.stdout or 'Created' in monitoring_start.stdout or monitoring_start.rc == 0"
